[package]
name = "tlog-near"
description = "chain-tlog NEAR backend: the transparency log as a NEAR smart contract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tlog-core = { workspace = true }
near-sdk.workspace = true
hex = { workspace = true, features = ["std"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
tlog-core = { workspace = true, features = ["dalek"] }
ed25519-dalek = { workspace = true, features = ["std"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.13.6-rust-1.86.0"
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
