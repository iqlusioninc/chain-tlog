name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features tlog-celestia/rpc,tlog-celestia/lumina -- -D warnings
      # Chain tests in tlog-e2e are #[ignore]d here and run in the e2e job.
      - run: cargo test --workspace --features tlog-celestia/rpc,tlog-celestia/lumina

  wasm:
    name: NEAR contract wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: cargo build -p tlog-near --target wasm32-unknown-unknown --release --locked
      - run: ls -l target/wasm32-unknown-unknown/release/tlog_near.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: tlog-near-wasm
          path: target/wasm32-unknown-unknown/release/tlog_near.wasm
          if-no-files-found: error

  e2e:
    name: end-to-end (NEAR sandbox + Celestia devnet)
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TLOG_NEAR_WASM: ${{ github.workspace }}/tlog_near.wasm
      COMPOSE: docker compose -f ci/celestia-devnet/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tlog-near-wasm
          path: ${{ github.workspace }}
      - name: Start Celestia devnet
        run: $COMPOSE up -d --wait --quiet-pull
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Build e2e tests
        run: cargo test -p tlog-e2e --no-run --locked
      # One test at a time: every test submits from the bridge's single
      # funded key, and parallel submissions race on its account sequence.
      - name: NEAR only
        run: cargo test -p tlog-e2e --test near -- --ignored --test-threads=1
      - name: Celestia only
        run: cargo test -p tlog-e2e --test celestia -- --ignored --test-threads=1
      - name: Both chains
        run: cargo test -p tlog-e2e --test both -- --ignored --test-threads=1
      - name: Devnet logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 300
      - name: Stop devnet
        if: always()
        run: $COMPOSE down -v
