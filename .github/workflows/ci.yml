name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features tlog-celestia/rpc,tlog-celestia/lumina,tlog-near-verifier/rpc -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p tlog-near --target wasm32-unknown-unknown --release
