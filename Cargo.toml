[workspace]
resolver = "2"
members = ["crates/tlog-core", "crates/tlog-celestia", "crates/tlog-e2e", "contracts/tlog-near"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/iqlusioninc/chain-tlog"
rust-version = "1.86"

[workspace.dependencies]
tlog-core = { path = "crates/tlog-core", default-features = false }
borsh = { version = "1.5", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.1", default-features = false }
thiserror = "2"
near-sdk = "5.30"
celestia-types = "1.3"
celestia-rpc = "1.3"
lumina-node = "1.3"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
