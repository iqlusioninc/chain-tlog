[package]
name = "tlog-near-verifier"
description = "chain-tlog NEAR verifier: a NEAR light client plus state proofs for the log contract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Fetch light-client blocks and state proofs over NEAR JSON-RPC. The RPC
# node is untrusted: everything it returns is checked by this crate.
rpc = ["dep:reqwest"]

[dependencies]
tlog-core = { workspace = true, features = ["dalek"] }
borsh.workspace = true
sha2.workspace = true
ed25519-dalek = { workspace = true, features = ["std"] }
thiserror.workspace = true
bs58 = "0.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tlog-near = { path = "../../contracts/tlog-near" }
near-sdk = { workspace = true, features = ["unit-testing"] }
ed25519-dalek = { workspace = true, features = ["std", "rand_core"] }
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "fetch-fixtures"
path = "examples/fetch_fixtures.rs"
required-features = ["rpc"]
